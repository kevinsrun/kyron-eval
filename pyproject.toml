[project]
name = "kyron-eval"
version = "0.1.0"
description = "Offline synthetic healthcare agent evaluation workbench"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1", "pydantic>=2.13.5,<3", "jinja2>=3.1,<4", "uvicorn>=0.34,<1", "httpx>=0.28,<0.29"]

[dependency-groups]
dev = ["pytest>=8.4,<9", "httpx>=0.28,<0.29", "ruff>=0.13,<1"]

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project.scripts]
kyron-eval = "kyron_eval.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/kyron_eval", "src/clinical_triage"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["unit: isolated unit tests", "fixture_contract: synthetic HTTP fixture contracts", "llm_protocol: optional-model protocol tests using scripted responses", "openemr_integration: opt-in tests against the real isolated local OpenEMR"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
